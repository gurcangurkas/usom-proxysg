name: USOM API to ProxySG Sync

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: pip install requests

    - name: API'den Veri Çek ve Formatla
      run: python update_list.py

    - name: Güncellenen Listeyi Depoya Commit Et
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add usom_local_db.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Güncel USOM Listesi" && git push)
