name: USOM API to ProxySG Sync

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: pip install requests

      - name: API'den Veri Çek ve Formatla
        run: python update_list.py

      - name: Sadece Txt Dosyasını Web Klasörüne Al
        run: |
          mkdir public
          mv usom_local_db.txt public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Txt Klasörünü Paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: İnternette Yayınla
        id: deployment
        uses: actions/deploy-pages@v5
